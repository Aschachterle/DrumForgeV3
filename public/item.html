<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/drum.css">
    <title>Loading... - Extrudo</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">
                ← Back to Models
            </a>
            <img class="header-logo" src="/images/logo.png" alt="Extrudo logo">
        </div>

        <div class="layout single-column">
            <div class="panel wide-panel">
                <div class="hero-carousel" id="heroCarousel">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Images loaded dynamically -->
                    </div>
                    <button class="carousel-btn carousel-prev" id="carouselPrev">‹</button>
                    <button class="carousel-btn carousel-next" id="carouselNext">›</button>
                    <div class="carousel-dots" id="carouselDots"></div>
                </div>
                <div class="panel-header" id="itemTitle">Loading...</div>
                <div class="description-collapsible">
                    <button class="description-toggle" id="descriptionToggle">
                        <span>About this model</span>
                        <span class="toggle-icon">▼</span>
                    </button>
                    <div class="description-content" id="descriptionContent">
                        <!-- Description loaded dynamically -->
                    </div>
                </div>
                <a href="#partsList" class="parts-link">View required parts & materials ↓</a>

                <!-- Download Section -->
                <div class="section">
                    <div class="section-title">
                        <div class="section-icon">1</div>
                        Download STL File
                    </div>
                    <div class="download-card">
                        <div class="download-info">
                            <h3 id="downloadLabel">Loading...</h3>
                            <p id="downloadDescription"></p>
                            <div class="file-details" id="fileDetails">
                                <!-- File details loaded dynamically -->
                            </div>
                        </div>
                        <a href="#" class="btn-submit download-btn" id="downloadBtn" download>
                            ⬇️ Download STL Files
                        </a>
                    </div>
                </div>

                <!-- Print Settings Section -->
                <div class="section">
                    <div class="section-title">
                        <div class="section-icon">2</div>
                        Recommended Print Settings
                    </div>
                    <div class="print-settings-grid" id="printSettings">
                        <!-- Print settings loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Materials & Parts Section -->
        <div class="materials-section" id="partsList">
            <div class="materials-header">
                <h2>Additional Parts & Materials</h2>
                <p>You'll need these items to complete your build.</p>
            </div>
            <div class="materials-grid" id="partsGrid">
                <!-- Parts loaded dynamically -->
            </div>
        </div>

        <!-- Image Lightbox Modal -->
        <div id="lightboxModal" class="lightbox-modal">
            <span class="lightbox-close">&times;</span>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
            <img class="lightbox-image" id="lightboxImage" alt="">
            <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <script>
        let itemData = null;
        let itemSlug = null;

        // Get slug from URL
        const urlParams = new URLSearchParams(window.location.search);
        itemSlug = urlParams.get('id');

        if (!itemSlug) {
            window.location.href = '/';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadItemData();
            initDescriptionToggle();
            initCarousel();
            initLightbox();
        });

        async function loadItemData() {
            try {
                const response = await fetch(`/api/items/${itemSlug}`);
                if (!response.ok) {
                    throw new Error('Item not found');
                }
                itemData = await response.json();
                renderItem();
            } catch (error) {
                console.error('Error loading item:', error);
                document.getElementById('itemTitle').textContent = 'Item Not Found';
                document.getElementById('descriptionContent').innerHTML = '<p>Sorry, this item could not be found.</p>';
            }
        }

        function renderItem() {
            // Update page title
            document.title = `${itemData.title} - Extrudo`;
            document.getElementById('itemTitle').textContent = itemData.title;

            // Render description
            const descContent = document.getElementById('descriptionContent');
            let descHtml = itemData.description.map(p => `<p>${p}</p>`).join('');
            if (itemData.note) {
                descHtml += `<p class="description-note">${itemData.note}</p>`;
            }
            descContent.innerHTML = descHtml;

            // Render images
            const track = document.getElementById('carouselTrack');
            track.innerHTML = itemData.images.map(img => 
                `<img src="/images/items/${itemSlug}/${img.src}" alt="${img.alt}">`
            ).join('');

            // Render download section
            document.getElementById('downloadLabel').textContent = itemData.downloadLabel;
            document.getElementById('downloadDescription').textContent = itemData.downloadDescription;
            document.getElementById('downloadBtn').href = itemData.downloadUrl;
            
            const fileDetails = document.getElementById('fileDetails');
            fileDetails.innerHTML = itemData.fileDetails.map(d => 
                `<span>${d.icon} ${d.text}</span>`
            ).join('');

            // Render print settings
            const printSettings = document.getElementById('printSettings');
            printSettings.innerHTML = itemData.printSettings.map(s => `
                <div class="print-setting">
                    <strong>${s.label}</strong>
                    <span>${s.value}</span>
                </div>
            `).join('');

            // Render parts list
            const partsGrid = document.getElementById('partsGrid');
            partsGrid.innerHTML = itemData.parts.map(p => `
                <div class="material-item">
                    <div class="material-icon">${p.icon}</div>
                    <div class="material-info">
                        <strong>${p.name}</strong>
                        <span>${p.description}</span>
                    </div>
                </div>
            `).join('');

            // Re-initialize carousel after images loaded
            setTimeout(() => {
                initCarousel();
                initLightbox();
            }, 100);
        }

        // Description Toggle
        function initDescriptionToggle() {
            const toggle = document.getElementById('descriptionToggle');
            const container = toggle.closest('.description-collapsible');
            
            toggle.addEventListener('click', () => {
                container.classList.toggle('collapsed');
            });
        }

        // Hero Carousel
        function initCarousel() {
            const track = document.getElementById('carouselTrack');
            const images = track.querySelectorAll('img');
            const prevBtn = document.getElementById('carouselPrev');
            const nextBtn = document.getElementById('carouselNext');
            const dotsContainer = document.getElementById('carouselDots');
            
            let currentIndex = 0;
            const totalSlides = images.length;
            
            // Clear existing dots
            dotsContainer.innerHTML = '';
            
            // Hide nav if only one image or none
            if (totalSlides <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                if (totalSlides === 0) return;
            } else {
                prevBtn.style.display = '';
                nextBtn.style.display = '';
            }
            
            // Create dots
            images.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });
            
            const dots = dotsContainer.querySelectorAll('.carousel-dot');
            
            function updateCarousel() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentIndex);
                });
            }
            
            function goToSlide(index) {
                currentIndex = index;
                updateCarousel();
            }
            
            function nextSlide() {
                currentIndex = (currentIndex + 1) % totalSlides;
                updateCarousel();
            }
            
            function prevSlide() {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateCarousel();
            }
            
            // Remove old listeners by cloning
            const newPrev = prevBtn.cloneNode(true);
            const newNext = nextBtn.cloneNode(true);
            prevBtn.parentNode.replaceChild(newPrev, prevBtn);
            nextBtn.parentNode.replaceChild(newNext, nextBtn);
            
            newPrev.addEventListener('click', prevSlide);
            newNext.addEventListener('click', nextSlide);
            
            // Touch/swipe support
            let touchStartX = 0;
            track.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            track.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextSlide();
                    else prevSlide();
                }
            }, { passive: true });
        }

        // Lightbox
        function initLightbox() {
            const modal = document.getElementById('lightboxModal');
            const modalImg = document.getElementById('lightboxImage');
            const modalCaption = document.getElementById('lightboxCaption');
            const closeBtn = modal.querySelector('.lightbox-close');
            const prevBtn = document.getElementById('lightboxPrev');
            const nextBtn = document.getElementById('lightboxNext');
            
            const carouselImages = Array.from(document.querySelectorAll('.carousel-track img'));
            let currentLightboxIndex = 0;
            
            function showImage(index) {
                if (carouselImages.length === 0) return;
                currentLightboxIndex = (index + carouselImages.length) % carouselImages.length;
                const img = carouselImages[currentLightboxIndex];
                modalImg.src = img.src;
                modalImg.alt = img.alt;
                modalCaption.innerHTML = img.alt || '';
            }
            
            function nextImage() {
                showImage(currentLightboxIndex + 1);
            }
            
            function prevImage() {
                showImage(currentLightboxIndex - 1);
            }

            // Click handlers for carousel images
            carouselImages.forEach((img, index) => {
                img.style.cursor = 'pointer';
                img.addEventListener('click', () => {
                    currentLightboxIndex = index;
                    showImage(index);
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });
            
            // Navigation
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                prevImage();
            });
            
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                nextImage();
            });

            closeBtn.addEventListener('click', closeLightbox);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowRight') nextImage();
                else if (e.key === 'ArrowLeft') prevImage();
            });
            
            // Touch support for lightbox
            let touchStartX = 0;
            modalImg.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            modalImg.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextImage();
                    else prevImage();
                }
            }, { passive: true });

            function closeLightbox() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // Fade in page
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });
        if (document.readyState === 'complete') {
            document.body.classList.add('loaded');
        }
    </script>
</body>
</html>
